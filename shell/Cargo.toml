# SoundCraft 的 OTools 插件外壳。
#
# 这一层是我们自己的代码：它把上游 `apps/soundcraft-web` 的浏览器外壳换成
# 「OTools 插件外壳」——UI 仍然是上游的 `soundcraft-ui-egui`（原封不动），
# 唯一的区别是文件从哪来、存到哪去（见 `src/otools.rs`）。
#
# 上游源码在 `../upstream`（按 upstream.pin 的 commit 浅拉取，保持原样勿改），
# 所以本 crate 用 path 依赖直接复用上游的 crate，不复制、不改动任何上游源码。
[package]
name = "otools-soundcraft-shell"
description = "SoundCraft as an OTools plugin: the upstream egui UI compiled to WebAssembly, with OTools host file I/O"
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# 独立的 workspace：上游 `upstream/` 有自己的 workspace，本 crate 不能并进去
# （它是 wasm-only 的，并进去会让宿主的 `cargo build` 也去编译 eframe/wgpu）。
[workspace]

[[bin]]
name = "otools-soundcraft"
path = "src/main.rs"

[dependencies]
soundcraft-engine = { path = "../upstream/crates/engine" }
soundcraft-ui-egui = { path = "../upstream/crates/ui-egui" }
soundcraft-playback = { path = "../upstream/crates/playback" }
soundcraft-model = { path = "../upstream/crates/model" }
soundcraft-mix = { path = "../upstream/crates/mix" }
soundcraft-dsp = { path = "../upstream/crates/dsp" }
soundcraft-audio-io = { path = "../upstream/crates/audio-io" }
soundcraft-midi = { path = "../upstream/crates/midi" }
soundcraft-time = { path = "../upstream/crates/time" }
soundcraft-video = { path = "../upstream/crates/video" }
soundcraft-clap-host = { path = "../upstream/crates/clap-host" }
soundcraft-vst3-host = { path = "../upstream/crates/vst3-host" }
soundcraft-au-host = { path = "../upstream/crates/au-host" }
egui = { version = "0.36", default-features = false }
log = { version = "0.4", default-features = false }
serde_json = { version = "1", features = ["float_roundtrip"] }
# 只在「不在 OTools 里」（把 dist 拖进普通浏览器）时用它弹浏览器选文件框；插件内不走。
rfd = "0.17"

# 只在 wasm 下需要的依赖（宿主/桌面下本 crate 什么都不做）。
# 注意：`rfd` 只为「不在 OTools 里」的浏览器兜底保留（上游网页版用它弹选文件框）；
# 插件内打开/保存都走宿主对话框（`src/otools.rs`）。
[target."cfg(target_arch = \"wasm32\")".dependencies]
eframe = { version = "0.36", default-features = false, features = ["persistence", "default_fonts", "wgpu", "accesskit"] }
base64 = "0.22"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target."cfg(target_arch = \"wasm32\")".dependencies.web-sys]
version = "0.3"
features = [
  "Blob",
  "BlobPropertyBag",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "EventTarget",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "Location",
  "Url",
  "UrlSearchParams",
  "Window",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
